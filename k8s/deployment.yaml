apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-department-portal
  namespace: college-department
  labels:
    app: college-department-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-department-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: college-department-portal
    spec:
      containers:
        - name: portal
          image: sanjeevsekar23/college-department-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
